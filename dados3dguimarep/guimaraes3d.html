<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3D6B4F">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Guimarães 3D — DataGis</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script>
    /* Tema guardado no index (claro por omissão); aplica-se antes de pintar para evitar flash */
    try { var t = localStorage.getItem('datagis-theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <div id="map"></div>

  <a id="voltar" class="voltar" href="../index.html" aria-label="Voltar à página principal">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Voltar</span>
  </a>

  <aside id="painel" class="painel" aria-label="Mapa de fundo e simbologia" hidden>
    <button id="painel-toggle" class="painel-titulo" type="button" aria-expanded="true">Camadas e simbologia</button>
    <div id="painel-corpo">
      <section>
        <h2>Mapa de fundo</h2>
        <div id="fundos" class="chips">
          <button type="button" data-v="imagery">Satélite</button>
          <button type="button" data-v="topo">Topográfico</button>
          <button type="button" data-v="navegacao">Ruas</button>
          <button type="button" data-v="osm">OSM</button>
          <button type="button" data-v="nenhum">Cor única</button>
        </div>
        <label id="linha-superficie" class="linha" hidden>Cor da superfície <input type="color" id="cor-superficie" value="#EFEBE0"></label>
        <label id="linha-sombreado" class="linha"><input type="checkbox" id="sombreado" checked> Sombreado do relevo</label>
      </section>

      <section>
        <h2><label><input type="checkbox" id="edif-vis" checked> <span class="amostra" id="amostra-edif"></span>Edifícios</label></h2>
        <div id="edif-modo" class="chips">
          <button type="button" data-v="imagem">Imagem</button>
          <button type="button" data-v="altura">Altura</button>
          <button type="button" data-v="unica">Cor única</button>
        </div>
        <label id="linha-edif-cor" class="linha" hidden>Cor <input type="color" id="edif-cor"></label>
        <label class="linha">Opacidade <input type="range" id="edif-opac" min="0.2" max="1" step="0.02" value="0.94"></label>
      </section>

      <section id="sec-linhas" hidden>
        <h2><label><input type="checkbox" id="linhas-vis" checked> <span class="amostra amostra-linha" id="amostra-linhas"></span>Linhas</label></h2>
        <label class="linha">Cor <input type="color" id="linhas-cor"></label>
        <label class="linha">Espessura <input type="range" id="linhas-larg" min="0.4" max="3" step="0.1" value="1"></label>
        <label class="linha">Opacidade <input type="range" id="linhas-opac" min="0.1" max="1" step="0.05" value="1"></label>
      </section>
    </div>
  </aside>

  <div id="carga" class="carga" aria-busy="true">
    <div class="carga-cartao">
      <img class="carga-logo" src="logo.png" alt="" width="72" height="72" onerror="this.remove()">
      <p class="carga-titulo">Guimarães 3D</p>
      <p id="carga-msg" class="carga-msg" role="status" aria-live="polite">A carregar…</p>
      <div class="carga-barra" aria-hidden="true"><span id="carga-fill"></span></div>
    </div>
  </div>

  <div id="status" class="hide" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/proj4@2.12.1/dist/proj4.js"></script>
  <script src="https://unpkg.com/geotiff@2.1.3/dist-browser/geotiff.js"></script>
  <script src="script.js?v=5"></script>
</body>
</html>
